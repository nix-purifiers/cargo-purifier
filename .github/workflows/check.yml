# SPDX-License-Identifier: MIT
#
# Runs the test suite on Linux and Darwin systems the flake supports, on every push to
# every branch and on every pull request. The flake's checks include the purifier
# contract's conformance checks that the sandbox can run; the two that need
# the network or a Nix daemon are the jobs of their names here.
name: check

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  composition:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest]
        toolchain: [default, current-stable]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build the Cargo integration
        run: |
          if [ '${{ matrix.toolchain }}' = current-stable ]; then
            system=$(nix eval --raw --impure --expr builtins.currentSystem)
            nix build ".#checks.$system.current-stable-tools" --out-link "$RUNNER_TEMP/cargo-tools"
          else
            nix build --out-link "$RUNNER_TEMP/cargo-tools"
          fi
          "$RUNNER_TEMP/cargo-tools/bin/cargo" --version
      - name: Compose, edit, build, publish, and consume with ordinary Cargo
        run: |
          nix shell --inputs-from . 'nixpkgs#python3' -c \
            python3 tests/composition-native.py "$RUNNER_TEMP/cargo-tools"

  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Flake checks
        run: nix flake check --print-build-logs
      - name: Downloads whose hash the lockfiles get wrong
        run: nix shell --inputs-from . 'nixpkgs#python3' -c tests/negative.sh

  # Relocking a fixture reproduces its lockfile byte for byte.
  conformance-relock:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Relock the fixtures
        run: |
          nix shell --inputs-from . 'nixpkgs#python3' -c tests/relock-fixtures.sh
          git diff --exit-code
      # The quickstart word for word, with the pushed commit, on ripgrep
      # 14.1.1: the lockfile must match the one the ripgrep checks build.
      - name: Relock ripgrep through the quickstart
        if: github.event_name == 'push'
        run: |
          git clone --quiet https://github.com/BurntSushi/ripgrep "$RUNNER_TEMP/ripgrep"
          cd "$RUNNER_TEMP/ripgrep"
          git checkout --quiet 4649aa9700619f94cf9c66876e9549d83420e16c
          SECONDS=0
          nix run "github:${{ github.repository }}/${{ github.sha }}" -- lock
          echo "cargo-purifier lock took ${SECONDS}s"
          cmp cargo-purifier.lock.json "$GITHUB_WORKSPACE/tests/projects/ripgrep/cargo-purifier.lock.json"

  # `cargo-purifier update` of a fixture that pins an old version leaves
  # both lockfiles usable.
  conformance-update:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Update the fixture that pins itoa 1.0.0
        run: |
          fixture="$RUNNER_TEMP/update"
          cp -r tests/fixtures/update "$fixture"
          tools=$(nix build --no-link --print-out-paths '.#cargo-purifier')
          "$tools/bin/cargo-purifier" update --manifest-path "$fixture/Cargo.toml"
          if grep -A1 '^name = "itoa"$' "$fixture/Cargo.lock" | grep -q '^version = "1.0.0"$'; then
            echo "cargo-purifier update left itoa at 1.0.0" >&2
            exit 1
          fi
          problems=$(nix eval --impure --json --expr \
            "(builtins.getFlake \"git+file://$PWD\").lib.cargo-purifier.readLock { src = $fixture; }" \
            --apply 'lock: lock.problems')
          echo "problems after the update: $problems"
          test "$problems" = "[]"

  # `nix build --rebuild` of a fixture gives the same output.
  conformance-rebuild:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build hello, then rebuild it
        run: |
          system=$(nix eval --raw --impure --expr builtins.currentSystem)
          nix build --no-link ".#checks.$system.workspace-hello"
          nix build --no-link --rebuild ".#checks.$system.workspace-hello"
